# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/image/webserver.pid;
error_log /var/log/sdkwork/image/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name image-staging.sdkwork.com image-staging.birdcoder.com image-staging.dtupay.com image-staging.sdkwork.cn image-staging.birdcoder.cn image-staging.dtupay.cn image-staging.skubc.com image-staging.skubc.cn image-staging.zowalk.com image-staging.zowalk.cn image-staging.offer86.com image-staging.offer86.cn image-staging.86offer.com image-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
